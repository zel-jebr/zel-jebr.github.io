name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A9C2D5: ${{ secrets.A9C2D5 }}
          B59CCE: ${{ secrets.B59CCE }}
        run: |
          python3 -c "
          import os, sys, pathlib
          a, b = os.environ.get('A9C2D5', ''), os.environ.get('B59CCE', '')
          html = pathlib.Path('index.html')
          text = html.read_text(encoding='utf-8')
          patched = text
          if a:
              patched = patched.replace('<!-- 7e2758ec129c8fc3c1f381b9ab24f17a2a -->', a)
          if b:
              patched = patched.replace('<!-- ec9992fcfe687fa316bb5afa76bb029d100572e0 -->', b)
          if patched == text and (a or b):
              sys.exit(1)
          if patched != text:
              html.write_text(patched, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
